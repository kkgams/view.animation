name: Publish Project Units
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.sha }}
      - run: make package
      - run: >-
          gh release create "$GITHUB_REF_NAME"
          build.nosync/view.animation-tree.zip
          build.nosync/view.animation-selector.zip
          build.nosync/view.animation-parameters.zip
          build.nosync/view.animation-blend-space-1d.zip
          build.nosync/view.animation-blend-space-2d.zip
          build.nosync/SHA256SUMS
          --generate-notes --verify-tag
